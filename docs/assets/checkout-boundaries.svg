<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1110" viewBox="0 0 480 1110" role="img" aria-labelledby="title desc">
  <title id="title">Checkout and reconciliation are separate paths</title>
  <desc id="desc">The server creates an intent and saves its order association, then returns the client secret so the browser can confirm with Stripe.js. Verified provider events and server reconciliation drive idempotent order updates. Watchers are in memory.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#627d98"/></marker></defs>
  <rect width="480" height="1110" rx="16" fill="#f4f7fb"/>
  <g font-family="system-ui, sans-serif" fill="#17324d" font-size="18">
    <text x="24" y="36" font-size="24" font-weight="700">Return the secret before</text><text x="24" y="65" font-size="24" font-weight="700">waiting for payment</text>
    <text x="24" y="107" font-size="16" font-weight="600">CHECKOUT REQUEST</text>
    <g fill="#e2edf8" stroke="#b0c9e0"><rect x="24" y="125" width="432" height="86" rx="10"/><rect x="24" y="251" width="432" height="86" rx="10"/><rect x="24" y="377" width="432" height="86" rx="10"/></g>
    <text x="44" y="159" font-size="22" font-weight="700">InitializePayment</text><text x="44" y="190">Save order ↔ intent ID</text>
    <text x="44" y="285" font-size="22" font-weight="700">Return client secret</text><text x="44" y="316">To the authenticated payer</text>
    <text x="44" y="411" font-size="22" font-weight="700">Browser confirms</text><text x="44" y="442">Stripe.js + payer action</text>
    <path d="M240 211V239" stroke="#627d98" stroke-width="2" marker-end="url(#arrow)"/><path d="M240 337V365" stroke="#627d98" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M24 490H456" stroke="#b0c9e0" stroke-dasharray="5 5"/>
    <text x="24" y="525" font-size="16" font-weight="600">SEPARATE SERVER-OWNED RECONCILIATION</text>
    <rect x="24" y="546" width="432" height="86" rx="10" fill="#17324d"/><text x="44" y="580" fill="#fff" font-size="22" font-weight="700">Saved intent ID</text><text x="44" y="611" fill="#d5e5f3">Survives process restart</text>
    <path d="M240 632V660" stroke="#627d98" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="24" y="672" width="432" height="86" rx="10" fill="#e2f3ec" stroke="#91c7ae"/><text x="44" y="706" font-size="22" font-weight="700">Wait / watch</text><text x="44" y="737">Verified provider events</text>
    <path d="M240 758V786" stroke="#627d98" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="24" y="798" width="432" height="86" rx="10" fill="#e2f3ec" stroke="#91c7ae"/><text x="44" y="832" font-size="22" font-weight="700">Update order</text><text x="44" y="863">Validate + deduplicate</text>
    <text x="24" y="925">Watchers live in memory.</text><text x="24" y="954">A browser return is not proof of payment.</text><text x="24" y="994" font-size="16">WaitForPayment has no timeout.</text><text x="24" y="1030" font-size="16">CompletePayment is a separate</text><text x="24" y="1057" font-size="16">Source-based charge flow.</text>
  </g>
</svg>
